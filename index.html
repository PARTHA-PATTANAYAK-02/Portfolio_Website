<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta
      name="description"
      content="Partha Pattanayak — Full Stack Developer Portfolio | MERN · Java · GenAI"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 46%, rgba(124, 58, 237, 0.16), transparent 42%),
          #0a0a0f;
        opacity: 1;
        visibility: visible;
        transition: opacity 420ms ease, visibility 420ms ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash .splash-content {
        display: grid;
        justify-items: center;
        gap: 18px;
        animation: splash-arrive 650ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #app-splash img {
        width: 68px;
        height: 68px;
        border-radius: 18px;
        box-shadow: 0 0 48px rgba(168, 85, 247, 0.34);
      }
      #app-splash .splash-name {
        color: rgba(255, 255, 255, 0.88);
        font: 600 13px/1.2 system-ui, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      #app-splash .splash-loader {
        width: 34px;
        height: 2px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.12);
      }
      #app-splash .splash-loader::after {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #a855f7, #ec4899);
        content: "";
        animation: splash-progress 900ms ease-in-out infinite alternate;
      }
      @keyframes splash-arrive {
        from { opacity: 0; transform: translateY(8px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes splash-progress {
        from { transform: translateX(0); }
        to { transform: translateX(125%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-content,
        #app-splash .splash-loader::after {
          animation: none;
        }
      }
    </style>

    <title>Partha Pattanayak — Full Stack Developer</title>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Loading portfolio">
      <div class="splash-content">
        <img src="/favicon.svg" alt="" />
        <span class="splash-name">Partha Pattanayak</span>
        <span class="splash-loader" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
